actions:
  - name: publish
    label: Publish site
    workflow: deploy-cloudflare.yml
    ref: current
    confirm:
      title: Publish to production?
      message: Builds the site and deploys it live. Draft posts stay hidden.
      button: Publish
  - name: preview
    label: Preview site
    workflow: deploy-cloudflare.yml
    ref: current
    confirm:
      title: Build preview?
      message: Takes 1-2 minutes, drafts included. View it at https://preview.hassananees.pages.dev (private, requires login).
      button: Build preview

media:
  - name: images
    label: Images
    input: src/assets
    output: ../../assets
  - name: documents
    label: Documents
    input: public/documents
    output: ../../../public/documents
  - name: covers
    label: Covers
    input: public/covers
    output: ../../../public/covers
content:
  - name: work
    label: Work
    type: collection
    path: src/content/work
    filename: '{primary}.md'
    view:
      fields: [title, organization, period, category]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: organization
        label: Organization
        type: string
      - name: period
        label: Period
        type: string
      - name: category
        label: Category
        type: select
        options:
          values:
            - value: industry
              label: Industry
            - value: research
              label: Research
      - name: startYear
        label: Start Year
        type: number

  - name: posts
    label: Writing
    type: collection
    path: src/content/posts
    filename: '{primary}.md'
    actions:
      - name: preview
        label: Preview site
        scope: entry
        workflow: deploy-cloudflare.yml
        ref: current
        confirm:
          title: Build preview?
          message: Takes 1-2 minutes, drafts included. View it at https://preview.hassananees.pages.dev (private, requires login).
          button: Build preview
      - name: publish
        label: Publish site
        scope: entry
        workflow: deploy-cloudflare.yml
        ref: current
        confirm:
          title: Publish to production?
          message: Builds the site and deploys it live. Draft posts stay hidden.
          button: Publish
    view:
      sort: pubDate
      order: desc
      fields: [ cover, title, body, date, published, pubDate, draft ] # title is the first entry and thus will be set to primary
    fields:
      - name: author
        label: Author
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: pubDate
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: cover
        label: Cover Image
        type: image
        options:
          multiple: false
          media: covers
      - name: attachments
        label: Attachments
        type: file
        options:
          multiple: true
          media: documents
      - name: body
        label: Body
        type: rich-text
    
